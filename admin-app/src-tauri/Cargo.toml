[package]
name = "access-portal-admin"
version = "0.1.0"
edition = "2021"
description = "Access Portal: runs the portal on the host and manages its users and apps."

# Not part of the portal crate's build: this app builds on its own.
[workspace]

[lib]
name = "access_portal_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
access-portal = { path = "../.." }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The portal decodes and encodes screen updates for every session; keep it fast
# even in development builds (`npm run dev`).
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
