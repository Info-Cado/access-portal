[package]
name = "access-portal-admin"
version = "0.2.17"
edition = "2021"
description = "Access Portal: runs the portal on the host and manages its users and apps."

# Not part of the portal crate's build: this app builds on its own.
[workspace]

[lib]
name = "access_portal_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
access-portal = { path = "../.." }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["process", "io-util", "time"] }
ureq = { version = "3", features = ["json"] }
getrandom = "0.3"
tracing = "0.1"
tauri-plugin-dialog = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
# The program picker (keeps shortcuts as shortcuts) and the shortcut reader.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The portal decodes and encodes screen updates for every session; keep it fast
# even in development builds (`npm run dev`).
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
