<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Access Portal Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sign in -->
  <main id="signin" class="signin" hidden>
    <form id="signin-form" class="signin-card" autocomplete="off">
      <div class="brand"><span class="mark"></span>Access Portal <em>Admin</em></div>
      <p class="lede">Sign in with a portal administrator account.</p>
      <label>Portal address
        <input id="in-server" placeholder="http://127.0.0.1:8088" spellcheck="false">
      </label>
      <label>Username
        <input id="in-user" spellcheck="false">
      </label>
      <label>Password
        <input id="in-pass" type="password">
      </label>
      <label id="code-row" hidden>Two-step verification code
        <input id="in-code" inputmode="numeric" maxlength="6" placeholder="6 digits">
      </label>
      <p id="signin-error" class="error" role="alert" hidden></p>
      <button class="btn primary wide" id="signin-btn">Sign in</button>
    </form>
  </main>

  <!-- App -->
  <div id="shell" class="shell" hidden>
    <aside class="rail">
      <div class="brand"><span class="mark"></span>Access Portal</div>
      <nav>
        <button class="nav on" data-view="users">Users <span class="count" id="n-users"></span></button>
        <button class="nav" data-view="apps">Apps <span class="count" id="n-apps"></span></button>
      </nav>
      <div class="rail-foot">
        <div class="who" id="who"></div>
        <div class="where" id="where"></div>
        <button class="btn ghost small" id="signout">Sign out</button>
      </div>
    </aside>

    <section class="main">
      <!-- Users -->
      <div class="view" id="view-users">
        <header class="bar">
          <h1>Users</h1>
          <input id="user-filter" class="search" placeholder="Search users" spellcheck="false">
          <button class="btn ghost" data-refresh>Refresh</button>
          <button class="btn primary" id="new-user">New user</button>
        </header>
        <div class="table-wrap">
          <table>
            <thead><tr><th>User</th><th>Windows login</th><th>Apps</th><th></th></tr></thead>
            <tbody id="user-rows"></tbody>
          </table>
          <p class="empty" id="users-empty" hidden></p>
        </div>
      </div>

      <!-- Apps -->
      <div class="view" id="view-apps" hidden>
        <header class="bar">
          <h1>Apps</h1>
          <span class="grow"></span>
          <button class="btn ghost" data-refresh>Refresh</button>
          <button class="btn primary" id="new-app">New app</button>
        </header>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Key</th><th>RDP host</th><th>Users</th><th></th></tr></thead>
            <tbody id="app-rows"></tbody>
          </table>
          <p class="empty" id="apps-empty" hidden>No apps yet. Add one, then tick it for the users who may open it.</p>
        </div>
      </div>
    </section>

    <!-- User detail drawer -->
    <aside class="drawer" id="drawer" hidden></aside>
  </div>

  <!-- Dialog (new user, new app, confirmations, one-time secrets) -->
  <div class="scrim" id="scrim" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
