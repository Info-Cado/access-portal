<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
html,body{margin:0;height:100%;background:#0b0e18;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e8ecf6}
#screen{position:absolute;display:block;outline:none;touch-action:none;-webkit-user-select:none;user-select:none}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e18;text-align:center;z-index:30}
#overlay.hidden,#drop.hidden,#panel.hidden,#toast.hidden{display:none}
#overlay .box{max-width:420px;padding:24px}
#overlay p{color:#9aa3ba;margin:8px 0 20px}
.btn{display:inline-block;background:#2453d6;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:.95rem;cursor:pointer;text-decoration:none;margin:0 4px}
.btn.sec{background:#2a3149}
form{display:inline}
#tools{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:2px;background:#171c2e;border:1px solid #2a3149;border-top:0;border-radius:0 0 10px 10px;padding:2px 4px;opacity:.35;transition:opacity .15s}
#tools:hover,#tools:focus-within,#tools.open{opacity:1}
#tools button{background:none;border:0;color:#e8ecf6;font-size:.8rem;padding:4px 10px;border-radius:7px;cursor:pointer}
#tools button:hover{background:#2a3149}
#tools .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5fd39a;margin-right:6px;vertical-align:1px}
#tools .dot.relayed{background:#e6b450}
#menu{position:fixed;top:34px;left:50%;transform:translateX(-50%);z-index:11;min-width:250px;background:#171c2e;border:1px solid #2a3149;border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
#menu.hidden{display:none}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#e8ecf6;font-size:.88rem;padding:9px 12px;border-radius:7px;cursor:pointer}
#menu button:hover{background:#2a3149}
#menu button small{display:block;color:#9aa3ba;font-size:.74rem;margin-top:2px}
#menu .danger{color:#ff8a80}
#menu hr{border:0;border-top:1px solid #2a3149;margin:4px 0}
#toast .acts{margin-top:8px;display:flex;gap:8px}
#toast .acts a{color:#fff;background:#2453d6;border-radius:6px;padding:5px 12px;text-decoration:none;font-size:.85rem}
#toast .acts a.sec{background:#2a3149}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);box-sizing:border-box;background:#171c2e;border-left:1px solid #2a3149;z-index:20;padding:16px;display:flex;flex-direction:column}
#panel h2{margin:0 0 6px;font-size:1.1rem}
#panel .hint{color:#9aa3ba;font-size:.82rem;margin:0 0 12px;line-height:1.4}
#panel .row{display:flex;gap:8px;margin-bottom:12px}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #2a3149;font-size:.88rem}
#list .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .size{color:#9aa3ba;font-size:.78rem}
#list a{color:#7c9bff;white-space:nowrap}
#list .empty{color:#9aa3ba;border:0}
#drop{position:fixed;inset:0;z-index:25;background:rgba(36,83,214,.25);border:3px dashed #7c9bff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;pointer-events:none}
#cursor{position:fixed;z-index:9;pointer-events:none;display:none;width:0;height:0}
#cursor img{position:absolute;left:0;top:0;filter:drop-shadow(0 0 1px #000)}
#bar{position:fixed;left:0;right:0;z-index:12;display:none;gap:4px;padding:4px;box-sizing:border-box;background:rgba(23,28,46,.92);border-top:1px solid #2a3149;overflow-x:auto;white-space:nowrap;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#bar button{flex:0 0 auto;min-width:40px;height:36px;padding:0 9px;border:1px solid #2a3149;border-radius:7px;background:#0e1220;color:#e8ecf6;font-size:.9rem}
#bar button.on{background:#2453d6;border-color:#2453d6}
#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;z-index:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:26;background:#171c2e;border:1px solid #2a3149;border-radius:8px;padding:10px 16px;font-size:.9rem;max-width:80vw}
</style>
</head>
<body>
<canvas id="screen" tabindex="0" width="1" height="1"></canvas>
<div id="tools">
  <button id="filesBtn" type="button" title="Shared files and print jobs"><span id="linkDot" class="dot"></span>Files</button>
  <button id="fullBtn" type="button" title="Full screen">Full screen</button>
  <button id="menuBtn" type="button" title="More" aria-haspopup="menu">&#8943;</button>
</div>
<div id="menu" class="hidden" role="menu">
  <button type="button" data-menu="disconnect">Disconnect<small>Leave your apps running and come back later</small></button>
  <button type="button" data-menu="signout" class="danger">Sign out of Windows<small>Closes your apps; save your work first</small></button>
  <hr>
  <button type="button" data-menu="logout">Log out of the portal</button>
</div>
<div id="cursor"><img id="cursorImg" alt=""></div>
<textarea id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Keyboard input"></textarea>
<div id="bar">
  <button type="button" data-act="kb" title="Keyboard">&#9000;</button>
  <button type="button" data-act="mode" title="Pointer or direct touch">Pointer</button>
  <button type="button" data-key="Escape">Esc</button>
  <button type="button" data-key="Tab">Tab</button>
  <button type="button" data-key="Enter">&#8629;</button>
  <button type="button" data-key="ArrowLeft">&larr;</button>
  <button type="button" data-key="ArrowUp">&uarr;</button>
  <button type="button" data-key="ArrowDown">&darr;</button>
  <button type="button" data-key="ArrowRight">&rarr;</button>
  <button type="button" data-key="Backspace">&#9003;</button>
  <button type="button" data-key="Delete">Del</button>
  <button type="button" data-mod="ControlLeft">Ctrl</button>
  <button type="button" data-mod="AltLeft">Alt</button>
  <button type="button" data-mod="ShiftLeft">Shift</button>
  <button type="button" data-key="F1">F1</button><button type="button" data-key="F2">F2</button><button type="button" data-key="F3">F3</button><button type="button" data-key="F4">F4</button>
  <button type="button" data-key="F5">F5</button><button type="button" data-key="F6">F6</button><button type="button" data-key="F7">F7</button><button type="button" data-key="F8">F8</button>
  <button type="button" data-key="F9">F9</button><button type="button" data-key="F10">F10</button><button type="button" data-key="F11">F11</button><button type="button" data-key="F12">F12</button>
</div>
<div id="panel" class="hidden">
  <h2>Files</h2>
  <p class="hint">Files here are shared with the app. Inside the app, open <b>Network &rarr; tsclient &rarr; <span id="driveName">P</span></b>, or type <code id="drivePath">\\tsclient\P</code> as the folder. Save files there to download them here. Drop files anywhere on this page to add them.</p>
  <div class="row"><button class="btn" id="pick" type="button">Upload files</button><button class="btn sec" id="closePanel" type="button">Close</button></div>
  <ul id="list"></ul>
  <input id="picker" type="file" multiple hidden>
</div>
<div id="drop" class="hidden">Drop files to send them to the app</div>
<div id="toast" class="hidden"></div>
<div id="overlay"><div class="box"><h2 id="title">Connecting…</h2><p id="detail"></p><div id="actions"></div></div></div>
<script>
(function () {
  "use strict";
  var key = "__KEY__";
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("screen"), ctx = canvas.getContext("2d"), overlay = $("overlay");
  var gotFrame = false, closed = false, draw = Promise.resolve();

  // ---- layout: the session follows the window; until the host catches up the picture is scaled ----
  var zoom = 1, cur = { x: 0, y: 0 }, touchUi = false, barH = 0;
  function view() {
    var v = window.visualViewport;
    return v ? { w: v.width, h: v.height, x: v.offsetLeft, y: v.offsetTop } : { w: window.innerWidth, h: window.innerHeight, x: 0, y: 0 };

  function fit() {
    var v = view(), availH = v.h - barH;
    var s = Math.min(v.w / canvas.width, availH / canvas.height, 1) * zoom;
    var w = Math.round(canvas.width * s), h = Math.round(canvas.height * s);

    var left = w <= v.w ? (v.w - w) / 2 : Math.min(0, Math.max(v.w - w, v.w / 2 - cur.x * s));
    var top = h <= availH ? (availH - h) / 2 : Math.min(0, Math.max(availH - h, availH / 2 - cur.y * s));
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    canvas.style.left = Math.round(v.x + left) + "px";
    canvas.style.top = Math.round(v.y + top) + "px";
    var bar = document.getElementById("bar");
    if (touchUi) bar.style.top = Math.round(v.y + v.h - barH) + "px";
    placeCursor();
  }
  function placeCursor() {
    var el = document.getElementById("cursor");
    if (!touchUi || padMode !== true) { el.style.display = "none"; return; }
    var r = canvas.getBoundingClientRect(), s = r.width / canvas.width;
    el.style.display = "block";
    el.style.left = (r.left + cur.x * s) + "px";
    el.style.top = (r.top + cur.y * s) + "px";
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", fit);
    window.visualViewport.addEventListener("scroll", fit);
  }
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    fit();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { send({ t: "resize", w: window.innerWidth, h: window.innerHeight }); }, 350);
  });

  function showEnd(title, detail) {
    closed = true;
    $("title").textContent = title;
    $("detail").textContent = detail || "";
    $("actions").innerHTML =
      '<a class="btn" href="">Reconnect</a>' +
      '<form method="post" action="/logout"><button class="btn sec">Log out of the portal</button></form>';
    overlay.classList.remove("hidden");
  }

  // ---- link to the portal: a direct peer-to-peer channel when possible, else a WebSocket ----
  var rtc = __RTC__;
  var query = "?w=" + window.innerWidth + "&h=" + window.innerHeight;
  var link = null;                       // { send(string), kind }

    try {
      d.dec = new VideoDecoder({
        output: function (frame) {
          try {
            ctx.drawImage(frame, d.x, d.y);

        error: function () { vstop(b); }      // decode failed; the next crisp tile repaints

    return out;
  };

  // that block back to tiles; drop the decoder so the sharp pixels are authoritative.
  function tilePaintedAt(x, y, w, h) {
    for (var b in decoders) {
      var d = decoders[b];

  // The portal passes Windows' operations through unchanged. Each runs after the
  // previous one finished, so the canvas always matches what Windows drew.
  var GCODEC = "avc1.640034";            // H.264 High; what Windows sends
  var GHW = /[?&]gsw=1/.test(location.search) ? "prefer-software" : /[?&]ghw=1/.test(location.search) ? "prefer-hardware" : "no-preference";
  var gq = Promise.resolve(), gts = 0;
  var gsurf = {}, gcache = {}, gdec = {};
  // Read-only counters for tests and diagnostics.
  var gstats = { frames: 0, pictures: 0, drawn: 0, timeouts: 0, errors: 0, lastFrameAt: 0, decodeMs: 0, queueMs: 0, queued: 0, decoderQueue: 0, maxDecoderQueue: 0, ops: {} };

    gq = gq.then(fn).catch(function (e) { if (window.console) console.warn("gfx", e); });

      output: function (frame) {
        var w = d.waiting.shift(), s = gsurf[sid];

          // of a video frame converts the whole picture, so drawing each rectangle
          // separately would convert it dozens of times.
          var c = s.ctx;

      error: function (e) {

  }
  function gvideo(buf) {
    var v = new DataView(buf), sid = v.getUint16(1, true), flags = v.getUint8(3), n = v.getUint16(4, true), off = 6, rects = [];
    for (var i = 0; i < n; i++, off += 8) rects.push([v.getUint16(off, true), v.getUint16(off + 2, true), v.getUint16(off + 4, true), v.getUint16(off + 6, true)]);

        return;

      case "ds": delete gsurf[o.id]; if (gdec[o.id]) { try { gdec[o.id].dec.close(); } catch (e) {} delete gdec[o.id]; } return;

        return;

  function onText(text) {
    var m = JSON.parse(text);
    if (m.t === "g") { m.ops.forEach(function (o) { gqueue(function () {
      var t = performance.now(), r = gop(o), rec = gstats.ops[o.o] || (gstats.ops[o.o] = { n: 0, ms: 0 });
      rec.n++;
      return Promise.resolve(r).then(function () { rec.ms += performance.now() - t; });
    }); }); return; }

      draw = draw.then(function () { canvas.width = m.w; canvas.height = m.h; cellSeq = {}; cur = { x: m.w / 2, y: m.h / 2 }; fit(); });
    } else if (m.t === "cur") {
      if (m.k === "png") canvas.style.cursor = "url(data:image/png;base64," + m.d + ") " + m.x + " " + m.y + ", default";
      else canvas.style.cursor = m.k;
      setPointerShape(m);
    } else if (m.t === "clip") {
      remoteCopied(m.s);
    } else if (m.t === "vstart") {
      vstart(m.b, m.g, m.x, m.y, m.w, m.h);
    } else if (m.t === "vstop") {
      vstop(m.b);
    } else if (m.t === "print") {
      printed(m.name, m.size);
    } else if (m.t === "closed") {
      showEnd("Session ended", m.m);
    }
  }

  // The direct channel is unordered, so a tile can arrive after a newer update to
  // the same area (e.g. the earlier one was lost and resent). cellSeq remembers the
  // highest batch drawn into each 256px cell, so a late older tile is skipped where
  // fresher pixels already exist. window.__cells is exposed only for tests.

          if (r.status === 409) return r.json().then(function (j) { offset = j.have; return retry(); });
          throw new Error("upload refused: " + r.status);
        }, retry);
    }
    function retry() {
      if (++attempts > 5) throw new Error("upload failed");
      return new Promise(function (ok) { setTimeout(ok, 1000 * attempts); }).then(step);
    }
    return step();
  }
  function upload(files) {
    files = Array.prototype.slice.call(files || []);
    if (!files.length) return;
    var done = 0, failed = 0;
    say("Sending " + files.length + (files.length === 1 ? " file…" : " files…"), true);
    var next = function () {
      var f = files.shift();
      if (!f) {
        say(failed ? (done + " sent, " + failed + " failed.") : ((done === 1 ? "File sent." : done + " files sent.") + " In the app, look in " + $("drivePath").textContent + "."));
        refresh();
        return;
      }
      sendFile(f, function (sent) {
        say("Sending " + f.name + "… " + Math.floor(100 * sent / Math.max(f.size, 1)) + "%", true);
      }).then(function () { done++; }, function () { failed++; }).then(next);
    };
    next();
  }
  // ---- session menu ----
  var menu = $("menu"), tools = $("tools");
  function setMenu(open) { menu.classList.toggle("hidden", !open); tools.classList.toggle("open", open); }
  $("menuBtn").addEventListener("click", function (e) { e.stopPropagation(); setMenu(menu.classList.contains("hidden")); });
  document.addEventListener("mousedown", function (e) { if (!menu.contains(e.target) && e.target !== $("menuBtn")) setMenu(false); });
  function logout() {
    var f = document.createElement("form"); f.method = "post"; f.action = "/logout";
    document.body.appendChild(f); f.submit();
  }
  menu.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-menu]") : null;
    if (!b) return;
    setMenu(false);
    var act = b.getAttribute("data-menu");
    if (act === "disconnect") {
      closed = true; closeLink();
      showEnd("Disconnected", "Your apps are still running. Reconnect any time to pick up where you left off.");
    } else if (act === "signout") {
      if (!confirm("Sign out of Windows? Your apps will close and unsaved work will be lost.")) return;
      $("title").textContent = "Signing out…"; $("detail").textContent = ""; $("actions").innerHTML = "";
      overlay.classList.remove("hidden");
      send({ t: "signout" });
    } else if (act === "logout") {
      closed = true; closeLink(); logout();
    }
  });
  function fullscreenOn() { return document.fullscreenElement || document.webkitFullscreenElement; }
  $("fullBtn").addEventListener("click", function () {
    var el = document.documentElement;
    if (fullscreenOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    canvas.focus();
  });
  document.addEventListener("fullscreenchange", function () { $("fullBtn").textContent = fullscreenOn() ? "Exit full screen" : "Full screen"; });

  // ---- printing: the session's "Portal printer" saves jobs as PDFs in the shared folder ----
  function printed(name, bytes) {
    var url = "/files/dl/" + encodeURIComponent(name);
    toast.innerHTML = "";
    var title = document.createElement("div"); title.textContent = "Printed: " + name + " (" + size(bytes) + ")";
    var acts = document.createElement("div"); acts.className = "acts";
    var open = document.createElement("a"); open.href = url + "?inline=1"; open.target = "_blank"; open.rel = "noopener"; open.textContent = /\.pdf$/i.test(name) ? "Open to print" : "Open";
    var dl = document.createElement("a"); dl.href = url; dl.className = "sec"; dl.setAttribute("download", name); dl.textContent = "Download";
    acts.appendChild(open); acts.appendChild(dl);
    toast.appendChild(title); toast.appendChild(acts);
    toast.classList.remove("hidden");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.classList.add("hidden"); }, 20000);
    if (!panel.classList.contains("hidden")) refresh();
  }

  $("filesBtn").addEventListener("click", function () { panel.classList.toggle("hidden"); if (!panel.classList.contains("hidden")) refresh(); });
  $("closePanel").addEventListener("click", function () { panel.classList.add("hidden"); canvas.focus(); });
  $("pick").addEventListener("click", function () { $("picker").click(); });
  $("picker").addEventListener("change", function (e) { upload(e.target.files); e.target.value = ""; });

  var dragDepth = 0;
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0; }
  window.addEventListener("dragenter", function (e) { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; drop.classList.remove("hidden"); });
  window.addEventListener("dragover", function (e) { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
  window.addEventListener("dragleave", function (e) { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; drop.classList.add("hidden"); } });
  window.addEventListener("drop", function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0; drop.classList.add("hidden");
    upload(e.dataTransfer.files);
  });
})();
</script>
</body>
</html>
