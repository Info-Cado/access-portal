[package]
name = "access-portal"
version = "0.1.0"
edition = "2021"
description = "Self-hosted remote access portal (library): login, 2FA and per-user app permissions in front of a Windows RDP host, with a built-in browser RDP client. Run by the Access Portal app in admin-app/."

[lib]
name = "access_portal"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7.9", features = ["macros", "ws"] }
axum-extra = { version = "0.9.6", features = ["cookie", "form"] }
tokio = { version = "1.42.0", features = ["full"] }
tower-http = { version = "0.6.2", features = ["trace"] }
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1.83"

serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

sqlx = { version = "0.8.2", features = ["runtime-tokio", "sqlite", "migrate"] }

# password hashing + random
argon2 = "0.5.3"
rand = "0.8.5"

# TOTP (2-step login)
totp-rs = { version = "5.6.0", features = ["gen_secret", "otpauth"] }

# crypto: at-rest secret encryption (AES-256-GCM)
aes-gcm = "0.10.3"
sha2 = "0.10.8"

base64 = "0.22.1"
hex = "0.4.3"

anyhow = "1.0.93"
tracing = "0.1.40"
png = "0.18.1"
ironrdp-tls = { version = "0.3", features = ["native-tls"] }
ironrdp-tokio = "0.12.0"
ironrdp-connector = "0.12.0"
ironrdp-session = "0.13.0"
ironrdp-input = "0.9.0"
ironrdp-pdu = "0.11.0"
ironrdp-core = "0.3.1"
ironrdp-graphics = "0.11.0"
ironrdp-cliprdr = "0.9.0"
ironrdp-rdpdr = "0.9.0"
ironrdp-dvc = "0.10.0"
ironrdp-egfx = "0.5.0"
ironrdp-displaycontrol = "0.10.0"
ironrdp-svc = "0.10.0"
futures-util = "0.3.34"
tokio-util = { version = "0.7.20", features = ["io"] }
ironrdp-rdpsnd = "0.11.0"
jpeg-encoder = "0.7.1"
webrtc = "0.21.1"
bytes = "1.12.1"
openh264 = "0.9"

# HTTPS for the local network, so browsers there get a secure context (and the
# H.264/AAC paths that need it). Self-signed certificate generated by rcgen.
axum-server = { version = "0.7.1", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
rcgen = "0.14.10"

[target."cfg(windows)".dependencies]
ironrdp-rdpdr-native = "0.9.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
